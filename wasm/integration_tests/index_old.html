<!-- emscripten example -->
<html lang=en-us>

<head>
    <meta charset=utf-8>
    <meta content="text/html; charset=utf-8" http-equiv=Content-Type>
    <script src="main.js"></script>
    <title>Wasm testing!</title>
</head>

<body>
    <script>
        (async ()=> {
            // instantiate WASM and import methods
            const response = await fetch('main.wasm');
            const buffer = await response.arrayBuffer();

            const module = await WebAssembly.compile(buffer);

            console.log(WebAssembly.Module.imports(module));
            // const wasm = await WebAssembly.instantiateStreaming(fetch('main.wasm'));
            const { memory, alloc_f64, dealloc_f64, runSimulations } = wasm.instance.exports;

            // input data for simulation
            const RESULTS_AMOUNT = 29;
            const TIME = 5;
            const SIMS = 20;
            const STOCKS = [7,4,2,1,2,
                            1,2,5,4,4,
                            10,9,5,7,2];
            const STOCKS_AMOUNT = 3;
            const STOCK_SIZE = 5;
            const WEIGHTS = [0.5, 0.25, 0.25];

            // allocate memory for simulation on heap
            const res_ptr = alloc_f64(RESULTS_AMOUNT);
            const stocks_ptr = alloc_f64(STOCKS.length);
            const weights_ptr = alloc_f64(WEIGHTS.length);
            // fill shared memory with requested values
            const results = new Float64Array(memory.buffer, res_ptr, RESULTS_AMOUNT);
            const stocks = new Float64Array(memory.buffer, stocks_ptr, STOCKS.length)
            stocks.set(STOCKS);
            const weights = new FloatArray(memory.buffer, weights_ptr, WEIGHTS.length);
            weights.set(WEIGHTS);

            // run main function utilizing buffers
            runSimulations(stocks.byteOffset, weights.byteOffset,
                           STOCKS_AMOUNT, STOCK_SIZE,
                           TIME, SIMS ,
                           results.byteOffset);

            console.log("Results: ", results);
            // dealloc allocated resources
            dealloc_f64(res_ptr);
            dealloc_f64(stocks_ptr);
            dealloc_f64(weights_ptr);
        })();
    </script>
    <h1>Open Console to see result</h1>
</body>

</html>
