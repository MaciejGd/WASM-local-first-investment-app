services:
    mongo:
        build: ./backend/mongo
        container_name: mongo

    backend:
        build: ./backend
        depends_on: 
            - mongo
        environment:
            MONGO_URI: mongodb://mongo:27017
        container_name: backend
        expose:
            - "5000"

    frontend:
        build: .
        ports:
            - "8080:80"
        depends_on:
            - backend
