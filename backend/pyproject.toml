[project]
name = "inv_app"
version = "1.0.0"
description = "Flask backend for local-first investment app"
dependencies = [
    "flask",
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["inv_app"]

[tool.ruff]
exclude = ["./venv", "./inv_app/__pycache__"]

[tool.ruff.lint]
ignore=["BLE001"]